name: build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.10.2 }
      - name: Build
        run: |
          F=$(find . -name settings.gradle -not -path './.git/*' | head -n1)
          cd "$(dirname "$F")"
          gradle build
          mkdir -p "$GITHUB_WORKSPACE/out"
          echo "--- all jars found ---"
          find . -name "*.jar" -not -path "*/gradle/wrapper/*" -not -path "*/.gradle/*" | head -20
          find . -path "*/build/libs/*.jar" -exec cp {} "$GITHUB_WORKSPACE/out/" \;
          ls -la "$GITHUB_WORKSPACE/out"
      - uses: actions/upload-artifact@v4
        with:
          name: hellking-scythe-jar
          path: out/
          if-no-files-found: error
